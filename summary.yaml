summary:
  enabled: true
  # local: 不依赖外部模型，基于最终转写文本生成基础纪要
  # llama: 自动启动本地 llama-server，并调用 /v1/chat/completions 生成纪要
  # openai: 调用已有 OpenAI 兼容 /v1/chat/completions 接口生成纪要
  # ollama: 复用 ASR_Control 的本地 Ollama /api/chat 方案
  provider: "llama"
  offline_enabled: true
  realtime_enabled: true
  base_url: ""
  api_key: ""
  model: "Qwen3.5-2B-Q4_0"
  model_path: "/app/lg-store/database/models/runtime/llm-summary/Qwen3.5-2B/Qwen3.5-2B-Q4_0.gguf"
  llama_server_bin: "llama-server"
  host: "127.0.0.1"
  port: 8065
  # 边端 CPU：ctx 过大只会更慢/更吃内存；8192 足够 1 万字分块 + 短输出
  ctx_size: 8192
  num_threads: 6
  n_gpu_layers: 0
  temperature: 0.2
  # 单次请求超时；整次 map-reduce = 分块数 + 1 次合并
  timeout: 240
  # 输入不截断：超长按行分块后合并。块越大轮次越少，边端更不易超时
  max_input_chars: 10000
  max_tokens: 768
  chunk_max_tokens: 384
  min_text_chars: 20
  realtime_min_chars: 80
  fallback_on_error: true
  enable_thinking: false
  transcript_dir: "outputs/transcripts"
  language: "zh"
  prompt: ""
  prompt_template: |
    /no_think
    你是语音内容摘要助手。请根据转写文本生成中文核心内容总结。

    目标：
    让读者快速掌握音频在讲什么、关键观点、完整要点与结论。

    要求：
    1. 只基于原文，不得补充或推测
    2. 必须归纳总结，不逐句复述，去除口语、重复、无意义填充
    3. 抓取核心信息：主题、关键观点、发生了什么、讨论了什么
    4. 保留关键事实：人名、品牌、事项、结论、决定、问题、时间
    5. 若原文有编号方法/步骤/清单，必须完整保留全部条目，每条只用一句短话
    6. 全文控制在 500-800 字，优先短句列表，不要长段落
    7. 商业合作/广告植入如有，单独用一条简要说明，不要当成会议待办

    输出格式：
    - **主题**：一句话
    - **核心观点**：1-3句
    - **要点**：
      1. ...
      2. ...
      （按原文完整列出）
    - **结论**：如有
    - **其他**：商业植入/补充信息（如有）

    转写内容：
    {text}
  chunk_prompt_template: |
    /no_think
    你是语音内容摘要助手。这是长音频的其中一段转写，请只总结本段。

    要求：
    1. 只基于本段原文，不得补充或推测
    2. 用短句要点列表，去掉口语和重复
    3. 若本段出现编号方法/步骤，保留编号与要点（一句一条）
    4. 本段摘要控制在 250 字以内，不要写主题/结论套话

    输出格式：
    - ...
    - ...

    本段转写：
    {text}
  merge_prompt_template: |
    /no_think
    你是语音内容摘要助手。下面是同一段音频按时间顺序切分后得到的分段摘要，请合并为一份完整中文总结。

    要求：
    1. 只基于分段摘要，不得补充或推测
    2. 去重合并，保持时间/逻辑顺序
    3. 编号方法、步骤、清单必须完整保留，不得因合并而丢掉后半段
    4. 去除口语、重复与互相矛盾的冗余表述
    5. 商业合作/广告植入如有，单独一条简要说明
    6. 全文控制在 500-800 字
    7. 输出结构：主题、核心观点、要点、结论、其他（如有）

    分段摘要：
    {text}
